<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wiki | RSlover521 Minecraft Server</title>
    <meta
      name="description"
      content="RSlover521 Minecraft Server wiki: getting started, server rules, rail network notes, useful links, and common questions."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/site-config.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div class="rail-parallax" aria-hidden="true">
      <div class="rail-parallax__image"></div>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="site-header">
      <a class="logo" href="/">RSlover521 <span class="logo-accent">Minecraft Server</span></a>
      <button
        class="nav-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="primary-nav"
        aria-expanded="false"
      >
        <span class="nav-toggle-line" aria-hidden="true"></span>
        <span class="nav-toggle-line" aria-hidden="true"></span>
        <span class="nav-toggle-line" aria-hidden="true"></span>
      </button>
      <nav class="nav" id="primary-nav" aria-label="Primary">
        <a href="/#story">Story</a>
        <a href="/#system">Why here</a>
        <a href="/#live-map">Live map</a>
        <a href="/#blue-map">3D map</a>
        <a href="/#join">Join</a>
        <a href="/wiki" aria-current="page">Wiki</a>
        <a href="/#community">Community</a>
      </nav>
      <p
        class="server-status server-status--loading js-server-status"
        role="status"
        aria-live="polite"
        aria-label="Minecraft server status: checking"
      >
        <span class="js-server-status-text">Checking...</span>
      </p>
    </header>

    <main id="top" class="wiki-page wiki-reader">
      <aside class="wiki-sidebar" aria-label="Wiki pages">
        <div class="wiki-sidebar-head">
          <p class="eyebrow">Server Wiki</p>
          <h1>Knowledge Base</h1>
          <label class="wiki-search">
            <span>Search pages</span>
            <input id="wiki-search" type="search" placeholder="Search the wiki" autocomplete="off" />
          </label>
        </div>
        <nav id="wiki-page-list" class="wiki-page-list" aria-label="Wiki page list"></nav>
      </aside>

      <article class="wiki-document-shell" aria-live="polite">
        <div class="wiki-document-tools">
          <a class="btn btn-ghost btn-small" href="/">Home</a>
          <button type="button" class="btn btn-primary btn-small js-copy-ip">Copy IP</button>
        </div>
        <div id="wiki-document" class="wiki-document">
          <p class="wiki-loading">Loading wiki...</p>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>Not affiliated with Mojang or Microsoft. Minecraft is a trademark of Mojang Synergies AB.</p>
      <p class="footer-meta">&copy; <span id="year"></span> RSlover521 Rail Network</p>
    </footer>

    <script src="/wiki/wiki-manifest.js"></script>
    <script src="/wiki/wiki.js"></script>
    <script src="/main.js"></script>
  </body>
</html>
